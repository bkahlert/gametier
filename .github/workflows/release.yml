name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
          }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Build Explorer command
        shell: pwsh
        run: |
          cmake -S desktopApp/packaging/explorer -B build/explorer -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/explorer --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/explorer -C Release --output-on-failure
      - name: Test
        shell: cmd
        run: kotlin.bat test
      - name: Stage application JARs
        shell: cmd
        run: kotlin.bat do stageInstaller -m desktopApp
      - name: Package Windows installer
        shell: pwsh
        run: |
          ./desktopApp/packaging/installer/Build-Installer.ps1 -AppVersion $env:APP_VERSION
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG "build/release/GameTier-$env:APP_VERSION.msi" `
            --verify-tag --title "GameTier $env:APP_VERSION" --generate-notes
