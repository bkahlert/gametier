name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows application
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
          }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Build Explorer command
        shell: pwsh
        run: |
          cmake -S desktopApp/packaging/explorer -B build/explorer -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/explorer --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/explorer -C Release --output-on-failure
      - name: Test
        shell: cmd
        run: kotlin.bat test
      - name: Stage application JARs
        shell: cmd
        run: kotlin.bat do stageInstaller -m desktopApp
      - uses: actions/upload-artifact@v6
        with:
          name: windows-application
          path: |
            build/tasks/_desktopApp_stageInstaller@packaging/*.jar
            build/explorer/Release/GameTierExplorer.dll
          if-no-files-found: error

  package:
    name: Package self-updating installer
    needs: windows
    runs-on: ubuntu-latest
    env:
      CONVEYOR_AGREE_TO_LICENSE: '1'
      CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: windows-application
          path: build
      - uses: ./.github/actions/setup-conveyor
      - name: Build update site
        shell: pwsh
        run: |
          ./desktopApp/packaging/installer/Build-UpdateSite.ps1 -AppVersion $env:RELEASE_TAG.Substring(1) -RequireSigningKey -StageOnly
      - name: Package update site
        run: conveyor --agree-to-license=1 --console=plain --parallelism=2 -f build/release/build.conveyor.conf make site --output-dir "$GITHUB_WORKSPACE/build/release/site"
      - uses: actions/upload-artifact@v6
        with:
          name: release-update-site
          path: build/release/site
          if-no-files-found: error
  verify:
    name: Verify release package
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: windows-application
          path: build
      - uses: actions/download-artifact@v7
        with:
          name: release-update-site
          path: build/release/site
      - name: Verify signed payload and update policy
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./desktopApp/packaging/installer/Test-UpdateSite.ps1 -Site build/release/site -AppVersion $env:RELEASE_TAG.Substring(1) -ExplorerLibrary build/explorer/Release/GameTierExplorer.dll

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-update-site
          path: build/release/site
      - name: Publish complete update site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/release/site/* --verify-tag --title "GameTier ${RELEASE_TAG#v}" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
