name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
          }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Test
        shell: cmd
        run: kotlin.bat test
      - name: Stage application JARs
        shell: cmd
        run: kotlin.bat do stageInstaller -m desktopApp
      - name: Package Windows installer
        shell: pwsh
        run: |
          $inputDirectory = 'build/tasks/_desktopApp_stageInstaller@packaging'
          Copy-Item LICENSE $inputDirectory
          jpackage `
            --type msi `
            --name GameTier `
            --app-version $env:APP_VERSION `
            --vendor 'Björn Kahlert' `
            --description 'Move games between storage tiers while preserving their original paths.' `
            --input $inputDirectory `
            --main-jar GameTier.jar `
            --main-class com.bkahlert.gametier.MainKt `
            --dest build/release `
            --icon desktopApp/packaging/GameTier.ico `
            --license-file LICENSE `
            --java-options '--enable-native-access=ALL-UNNAMED' `
            --win-per-user-install `
            --win-menu `
            --win-upgrade-uuid 9db43bc2-4812-4649-a1a0-66489bdf19c0
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG "build/release/GameTier-$env:APP_VERSION.msi" `
            --verify-tag --title "GameTier $env:APP_VERSION" --generate-notes
