include required("/stdlib/jdk/25/openjdk.conf")

app {
  display-name = GameTier
  fsname = gametier
  rdns-name = com.bkahlert.gametier
  vendor = "Björn Kahlert"
  description = "Move games between storage tiers while preserving their original paths."
  license = MIT
  vcs-url = "https://github.com/bkahlert/gametier"
  machines = [windows.amd64]
  updates = background
  signing-key = ${?env.CONVEYOR_SIGNING_KEY}
  icons = "../../../shared/composeResources/drawable/gametier.svg"

  jvm {
    gui = com.bkahlert.gametier.MainKt
    options += "--enable-native-access=ALL-UNNAMED"
    windows {
      options += "-Dgametier.appPath=&&/../bin/GameTier.exe"
      override-appdata-env = false
    }
  }

  windows.manifests.msix {
    identity-name = GameTier
    application-id = GameTier
    min-version = "10.0.19041.0"
    capabilities += "rescap:allowElevation"
    capabilities += "rescap:unvirtualizedResources"
    virtualization.excluded-directories = ["LocalAppData/GameTierData"]
    namespaces {
      desktop5 = "http://schemas.microsoft.com/appx/manifest/desktop/windows10/5"
      desktop6 = "http://schemas.microsoft.com/appx/manifest/desktop/windows10/6"
    }
    ignorable-namespaces += desktop5
    ignorable-namespaces += desktop6
    additional-properties-xml = "<desktop6:RegistryWriteVirtualization>disabled</desktop6:RegistryWriteVirtualization>"
    extensions-xml = """
      <com:Extension Category="windows.comServer">
        <com:ComServer>
          <com:SurrogateServer DisplayName="GameTier Explorer command">
            <com:Class Id="9B6ED281-384A-4DBF-98C0-D26B6D41B352" Path="bin/GameTierExplorer.dll" ThreadingModel="STA" />
          </com:SurrogateServer>
        </com:ComServer>
      </com:Extension>
      <desktop4:Extension Category="windows.fileExplorerContextMenus">
        <desktop4:FileExplorerContextMenus>
          <desktop5:ItemType Type="*">
            <desktop5:Verb Id="PromoteWithGameTier" Clsid="9B6ED281-384A-4DBF-98C0-D26B6D41B352" />
          </desktop5:ItemType>
          <desktop5:ItemType Type="Directory">
            <desktop5:Verb Id="PromoteWithGameTier" Clsid="9B6ED281-384A-4DBF-98C0-D26B6D41B352" />
          </desktop5:ItemType>
        </desktop4:FileExplorerContextMenus>
      </desktop4:Extension>
    """
  }
}
