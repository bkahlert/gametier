<body>
  <header class="review-bar">
    <div class="review-name">GAMETIER <span style="font-weight:400;opacity:.45;padding:0 7px">/</span> INTERFACE REVIEW</div>
    <div class="review-note">Concept A · interactive screen study · sample data · no file changes</div>
    <div class="review-tools" aria-label="Preview appearance"><button class="active" data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
  </header>
  <nav class="screen-nav" aria-label="Preview screens"></nav>
  <div id="app" class="app-window"></div>
  <footer class="caption"><p id="screen-caption"></p><p class="caption-right">Use the screen tabs to inspect each state, or try Add promotion, Demote, Settings, and the activity panel.</p></footer>
  <script>
    const paths={folder:'M3 6h6l2 2h10v12H3z M3 8V5h6l2 2',file:'M6 3h8l4 4v14H6z M14 3v5h4',plus:'M12 5v14M5 12h14',up:'M12 20V4M6 10l6-6 6 6',down:'M12 4v16M6 14l6 6 6-6',chevron:'M7 10l5 5 5-5',left:'M14 6l-6 6 6 6M8 12h12',search:'M20 20l-5-5 M17 10a7 7 0 1 0-14 0 7 7 0 0 0 14 0',drive:'M5 5h14l3 10v5H2v-5z M2 15h20M17 18h2',gear:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0',warning:'M12 3L2 21h20z M12 9v5M12 17v.2',info:'M22 12a10 10 0 1 0-20 0 10 10 0 0 0 20 0 M12 11v6M12 7v.1',check:'M5 12l4 4L19 6',close:'M6 6l12 12M6 18L18 6',refresh:'M20 8a8 8 0 1 0 0 8M20 3v5h-5',clock:'M21 12a9 9 0 1 0-18 0 9 9 0 0 0 18 0M12 7v5l3 2',min:'M4 12h16',max:'M5 5h14v14H5z'};
    const icon=(name,extra='')=>`<svg class="icon ${extra}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.folder}"/></svg>`;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const games=[{name:"Baldur’s Gate 3",original:'D:\\Games\\Baldurs Gate 3',folder:'E:\\FastGames'},{name:'Cyberpunk 2077',original:'D:\\Games\\Cyberpunk 2077',folder:'E:\\FastGames'},{name:'Hades II',original:'D:\\Games\\Hades II',folder:'E:\\FastGames'},{name:'Hollow Knight',original:'D:\\Games\\Hollow Knight',folder:'E:\\FastGames'},{name:'profile.sav',original:'D:\\Emulation\\Saves\\profile.sav',folder:'E:\\FastGames',file:true}];
    const screens=[['home','Promotions'],['drop','Drag & drop'],['review','Add review'],['activity','Activity'],['settings','Settings'],['first','First use'],['attention','Needs attention'],['demote','Demote'],['close','Close while busy']];
    const captions={home:'<strong>01 / Promotions</strong><br>A familiar list, a clear primary action, and the destination always in view.',drop:'<strong>02 / Drag & drop</strong><br>The whole content area becomes a drop target. Dropping opens the review.',review:'<strong>03 / Add review</strong><br>Check the destination and selection once. Adjustments are visible before moving data.',activity:'<strong>04 / Activity</strong><br>Keep using the app while transfers run. Results stay available for this session.',settings:'<strong>05 / Settings</strong><br>One editable setting. Previously used destinations remain visible when the default changes.',first:'<strong>06 / First use</strong><br>Start from the normal screen. A first drop is retained while a destination is chosen.',attention:'<strong>07 / Needs attention</strong><br>Unavailable storage and interrupted promotions are visible, with details to inspect.',demote:'<strong>08 / Demote</strong><br>Confirm where the item will move back. A successful demotion leaves the promotions list.',close:'<strong>09 / Closing during work</strong><br>Finish the queue before exiting. No cancellation of an active move.'};
    let state='home',activityOpen=false,defaultFolder='E:\\FastGames',batchFolder=defaultFolder,selectedGame=games[1],hasQueue=false,menuOpen=false,changeDestination=false,previewItems=null,detailsOpen=false,settingsMessage='',query='',closeWhenDone=false;
    const nav=document.querySelector('.screen-nav');
    nav.innerHTML=screens.map(([id,label])=>`<button data-screen="${id}">${label}</button>`).join('');
    function setScreen(next){state=next;menuOpen=false;changeDestination=false;detailsOpen=false;query='';settingsMessage='';if(next==='activity'||next==='close'){hasQueue=true;activityOpen=true}if(next==='review')batchFolder=defaultFolder;if(next==='home'){hasQueue=false;activityOpen=false;closeWhenDone=false}render()}
    function titlebar(){return `<div class="titlebar"><img class="app-logo" src="../../../shared/composeResources/drawable/gametier.svg" alt=""><span>GameTier</span><div class="window-controls" aria-label="Window preview"><span>${icon('min')}</span><span>${icon('max')}</span><button aria-label="Close window" data-action="close-window">${icon('close')}</button></div></div>`}
    function heading(){return `<div class="heading"><div><h1>Promotions</h1><p>Keep your files where apps expect them. Move the data where you want it.</p></div><div class="heading-actions"><div class="button-group"><button class="primary" data-action="add">${icon('plus')}Add promotion</button><button class="primary" data-action="add-menu" aria-label="Choose files or folders" aria-expanded="${menuOpen}">${icon('chevron')}</button>${menuOpen?`<div class="menu"><button data-action="add">${icon('file')}Choose files…</button><button data-action="add">${icon('folder')}Choose folders…</button></div>`:''}</div><button class="settings-button" data-screen="settings">${icon('gear')}Settings</button></div></div>`}
    function destinationBar(){return `<div class="destination-bar">${icon('drive')}<span>Default destination</span><span class="mono">${state==='first'?'Not set':escapeHtml(defaultFolder)}</span><button class="ghost" data-screen="settings">${state==='first'?'Choose folder':'Change'}</button></div>`}
    function promotionRow(game,index){const needs=state==='attention'&&index===3;return `<tr><td><div class="item"><span class="item-icon">${icon(game.file?'file':'folder')}</span><div class="stack"><div class="item-name" title="${escapeHtml(game.name)}">${escapeHtml(game.name)}</div><div class="item-path" title="${escapeHtml(game.original)}">${escapeHtml(game.original)}</div></div></div></td><td><span class="mono">${escapeHtml(game.folder)}</span></td><td><span class="status ${needs?'warning':''}">${needs?icon('warning'):'<span class="dot"></span>'}${needs?'Needs attention':'Promoted'}</span></td><td><button class="row-action ${needs?'':'ghost'}" data-action="${needs?'attention-details':'demote'}" data-index="${index}">${needs?'Details':'Demote'}</button></td></tr>`}
    function promotionTable(){const filtered=games.map((g,i)=>({g,i})).filter(({g})=>(g.name+' '+g.original+' '+g.folder).toLowerCase().includes(query.toLowerCase()));return `<table class="promotions"><thead><tr><th scope="col">Name / original location</th><th scope="col">Promotion folder</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${filtered.map(({g,i})=>promotionRow(g,i)).join('')}</tbody></table>${filtered.length?'':'<div class="no-results">No promotions match your search.</div>'}`}
    function activity(){return `<section class="activity-footer" aria-label="Activity">${hasQueue?'<div class="busy-line" role="progressbar" aria-label="Transfer in progress"></div>':''}<button class="activity-toggle" data-action="activity-toggle" aria-expanded="${activityOpen}">${hasQueue?'<span class="spinner"></span>':icon('clock')}<strong>Activity</strong><span class="muted">${hasQueue?'1 running · 1 queued':'No transfers running'}</span>${hasQueue?'<span class="badge">1 failed</span>':''}${closeWhenDone?'<span class="muted">Closing when finished</span>':''}<span class="chev" style="transform:rotate(${activityOpen?'180':'0'}deg)">${icon('chevron')}</span></button>${activityOpen?`<div class="activity-content"><div class="activity-labels"><span>This session</span><span>Files are processed one at a time</span></div>${hasQueue?`<div class="activity-row"><span class="activity-state" style="color:var(--accent)"><span class="spinner"></span>Promoting</span><div class="stack"><strong>Disco Elysium</strong><span class="mono muted">D:\\Games\\Disco Elysium → ${escapeHtml(batchFolder)}</span></div></div><div class="activity-row"><span class="activity-state">${icon('clock')}Queued</span><div class="stack"><strong>Emulation</strong><span class="mono muted">D:\\Emulation → ${escapeHtml(batchFolder)}</span></div></div><div class="activity-row"><span class="activity-state" style="color:var(--amber)">${icon('warning')}Failed</span><div><strong>Celeste</strong><div class="message">A folder named Celeste already exists in the destination. Nothing was overwritten.</div></div><button class="ghost row-action" style="margin-left:auto" data-action="failure-details">Details</button></div>`:'<div class="activity-row muted">Completed operations will appear here until you close GameTier.</div>'}</div>`:''}</section>`}
    function firstUse(){return `<div class="empty"><div class="big-icon">${icon('up')}</div><h2>Your first promotion starts here</h2><p>Drop a file or folder anywhere in this window, or browse to choose one. We’ll ask where you want to move it.</p><button class="primary" data-action="first-add">${icon('plus')}Add promotion</button><p class="small">The original location keeps working through a link.</p></div>`}
    function mainContent(){return `<main class="main">${heading()}${destinationBar()}${state==='first'?firstUse():`${state==='attention'?`<div class="banner">${icon('warning')}<div><strong>A promotion folder is unavailable</strong><p><span class="mono">F:\\PortableGames</span> — reconnect the drive to view its promotions.</p></div><button data-action="destination-details">Details</button></div>`:''}<div class="search-row"><label class="search">${icon('search')}<input id="search" type="search" placeholder="Search promotions" aria-label="Search promotions" value="${escapeHtml(query)}"></label><span class="count">${games.length} promotions${state==='attention'?' · 1 needs attention':''}</span><button class="icon-button ghost" aria-label="Refresh promotions" data-action="refresh" ${hasQueue?'disabled title="Inventory will refresh after the current transfer"':''}>${icon('refresh')}</button></div><div id="table-area">${promotionTable()}</div><div class="drop-hint">${icon('up')}Drop files or folders anywhere here to add promotions</div>`}</main>`}
    function settings(){return `<main class="main"><button class="back ghost" data-screen="home">${icon('left')}Promotions</button><div class="heading"><div><h1>Settings</h1><p>Choose where new promotions go.</p></div></div><div class="settings-content"><h2 class="section-label">Storage</h2><section class="settings-card"><div class="settings-card-header">${icon('drive')}<div><h2>Default promotion folder</h2><p>New additions use this folder unless you choose another destination.</p></div></div><div class="settings-field"><input id="default-folder" aria-label="Default promotion folder" value="${escapeHtml(defaultFolder)}" spellcheck="false"><button data-action="browse-default">Browse…</button><button data-action="save-default">Save</button></div></section><div class="settings-status" role="status">${escapeHtml(settingsMessage)}</div><div class="settings-note">${icon('info')}<span>Changing the default doesn’t move existing promotions or change queued work.</span></div><h2 class="section-label">Previously used folders</h2><p class="remembered">GameTier keeps listing promotions from these locations.</p><div class="remembered-row">${icon('drive')}<span class="mono">E:\\FastGames</span><span class="grow"></span><span class="status"><span class="dot"></span>Available</span></div><div class="remembered-row">${icon('drive')}<span class="mono">F:\\PortableGames</span><span class="grow"></span><span class="status"><span class="dot"></span>Available</span></div></div></main>`}
    function review(){const items=previewItems||[{name:'Disco Elysium',path:'D:\\Games\\Disco Elysium'},{name:'Emulation',path:'D:\\Emulation'},{name:'Hades II',path:'D:\\Games\\Hades II',skip:true}];const ready=items.filter(i=>!i.skip).length;return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="review-title"><div class="dialog-body"><h2 id="review-title">Add promotions</h2><p>Move these items to your promotion folder. A link keeps each original location working.</p><label class="field-label">Promotion folder</label><div class="destination-picker">${icon('drive')}<span class="mono">${escapeHtml(batchFolder)}</span>${batchFolder===defaultFolder?'<span class="default-label">Default</span>':''}<button class="ghost" data-action="change-batch">Change</button></div>${changeDestination?`<div class="destination-options"><button data-destination="E:\\FastGames">${icon('drive')}E:\\FastGames</button><button data-destination="F:\\PortableGames">${icon('drive')}F:\\PortableGames</button></div>`:''}<p class="help">Applies to this addition. Your default stays unchanged.</p><div class="review-items">${items.map(item=>`<div class="review-item"><span class="item-icon">${icon(item.file?'file':'folder')}</span><div class="stack"><span class="item-name">${escapeHtml(item.name)}</span><span class="item-path" title="${escapeHtml(item.path)}">${escapeHtml(item.path)}</span></div><span class="status ${item.skip?'muted':''}">${icon(item.skip?'info':'check')}${item.skip?'Already promoted':'Ready'}</span></div>`).join('')}</div><div class="review-summary">${icon('info')}${ready} ready${previewItems?'':'. Hades II will be skipped. One duplicate selection removed.'}</div></div><div class="dialog-actions"><button data-action="dismiss">Cancel</button><button class="primary" data-action="promote">${icon('up')}Promote ${ready} ${ready===1?'item':'items'}</button></div></section></div>`}
    function demoteDialog(){return `<div class="modal-shade"><section class="dialog small-dialog" role="dialog" aria-modal="true" aria-labelledby="demote-title"><div class="dialog-body"><h2 id="demote-title">Demote ${escapeHtml(selectedGame.name)}?</h2><p>Move the data back to its original location and replace the link with the ${selectedGame.file?'file':'folder'}.</p><dl class="path-pair"><div><dt>From</dt><dd class="mono">${escapeHtml(selectedGame.folder+'\\'+selectedGame.original.split('\\').pop())}</dd></div><div><dt>Move back to</dt><dd class="mono">${escapeHtml(selectedGame.original)}</dd></div></dl><div class="info-box">The ${selectedGame.file?'file':'folder'} stays at its original location and leaves your promotions list when the move finishes.</div></div><div class="dialog-actions"><button data-action="dismiss">Cancel</button><button class="primary" data-action="confirm-demote">${icon('down')}Demote</button></div></section></div>`}
    function closeDialog(){return `<div class="modal-shade"><section class="dialog small-dialog" role="dialog" aria-modal="true" aria-labelledby="close-title"><div class="dialog-body"><h2 id="close-title">Transfers are still running</h2><p>GameTier needs to stay open while moving your files.</p><div class="info-box"><div class="flex"><span class="spinner"></span><strong>Promoting Disco Elysium</strong></div><p style="margin-top:7px">One more item is queued. Close when finished completes the queue, then exits.</p></div></div><div class="dialog-actions"><button data-action="keep-open">Keep open</button><button class="primary" data-action="close-after">Close when finished</button></div></section></div>`}
    function attentionDialog(){return `<div class="modal-shade"><section class="dialog small-dialog" role="dialog" aria-modal="true" aria-labelledby="attention-title"><div class="dialog-body"><h2 id="attention-title">Hollow Knight needs attention</h2><p>The original location no longer links to the promoted folder. GameTier can’t safely demote it in this state.</p><dl class="path-pair"><div><dt>Original location</dt><dd class="mono">D:\\Games\\Hollow Knight</dd></div><div><dt>Promoted location</dt><dd class="mono">E:\\FastGames\\Hollow Knight</dd></div></dl><div class="info-box">Inspect both locations before making changes. Refresh promotions after resolving the issue.</div></div><div class="dialog-actions"><button class="primary" data-action="dismiss-details">Close</button></div></section></div>`}
    function dropOverlay(){return `<div class="drop-overlay">${icon('up')}<h2>Drop to add promotions</h2><p>Files and folders are welcome.</p><div class="destination-picker">${icon('drive')}<span class="mono">${escapeHtml(defaultFolder)}</span></div><span class="small">Review your selection before anything moves.</span><button style="margin-top:22px" data-action="add">Preview the review</button></div>`}
    function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===state));document.getElementById('screen-caption').innerHTML=captions[state]||captions.home;const app=document.getElementById('app');app.innerHTML=titlebar()+(state==='settings'?settings():mainContent())+activity()+(state==='review'?review():state==='demote'?demoteDialog():state==='close'?closeDialog():state==='drop'?dropOverlay():detailsOpen?attentionDialog():'');const dialog=app.querySelector('[role="dialog"]');if(dialog){Array.from(app.children).filter(el=>!el.contains(dialog)).forEach(el=>el.inert=true);dialog.querySelector('button')?.focus({preventScroll:true})}}
    function simpleDialog(title,body){const overlay=document.createElement('div');overlay.className='modal-shade';overlay.innerHTML=`<section class="dialog small-dialog" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="dialog-body"><h2>${escapeHtml(title)}</h2>${body}</div><div class="dialog-actions"><button class="primary" data-action="dismiss-details">Close</button></div></section>`;const app=document.getElementById('app');Array.from(app.children).forEach(el=>el.inert=true);app.append(overlay);overlay.querySelector('button').focus()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){document.body.classList.toggle('dark',b.dataset.theme==='dark');document.querySelectorAll('[data-theme]').forEach(t=>t.classList.toggle('active',t===b));return}if(b.dataset.screen){previewItems=null;setScreen(b.dataset.screen);return}if(b.dataset.destination){batchFolder=b.dataset.destination;changeDestination=false;render();return}const action=b.dataset.action;if(action==='add'){state='review';batchFolder=defaultFolder;menuOpen=false;render()}else if(action==='add-menu'){menuOpen=!menuOpen;render()}else if(action==='dismiss'){state=hasQueue?'activity':'home';previewItems=null;render()}else if(action==='change-batch'){changeDestination=!changeDestination;render()}else if(action==='promote'){state='activity';hasQueue=true;activityOpen=true;previewItems=null;render()}else if(action==='demote'){selectedGame=games[Number(b.dataset.index)];state='demote';render()}else if(action==='activity-toggle'){activityOpen=!activityOpen;render()}else if(action==='close-window'){if(hasQueue)setScreen('close');else simpleDialog('Close GameTier','<p>No transfers are running. In the app, this closes the window.</p>')}else if(action==='keep-open'){state='activity';render()}else if(action==='close-after'){closeWhenDone=true;state='activity';render()}else if(action==='attention-details'){detailsOpen=true;render()}else if(action==='dismiss-details'){detailsOpen=false;render()}else if(action==='destination-details'){simpleDialog('Promotion folder unavailable','<p>GameTier can’t read this folder. Reconnect the drive and refresh promotions.</p><div class="info-box mono">F:\\PortableGames</div><p style="margin-top:15px">Promotions from this folder can’t be listed while it is unavailable.</p>')}else if(action==='failure-details'){simpleDialog('Celeste wasn’t promoted','<p>An item with the same name already exists in the destination. Nothing was overwritten.</p><dl class="path-pair"><div><dt>Original location</dt><dd class="mono">D:\\Games\\Celeste</dd></div><div><dt>Existing destination</dt><dd class="mono">E:\\FastGames\\Celeste</dd></div></dl><div class="info-box">Choose another promotion folder, or inspect the existing item before adding Celeste again.</div>')}else if(action==='refresh'){simpleDialog('Promotions refreshed','<p>The list is up to date.</p>')}else if(action==='browse-default'){defaultFolder=defaultFolder==='E:\\FastGames'?'F:\\PortableGames':'E:\\FastGames';settingsMessage='Default folder saved.';render()}else if(action==='save-default'){const value=document.getElementById('default-folder').value.trim();if(!/^[A-Za-z]:\\/.test(value)&&!/^\\\\[^\\]+\\[^\\]+/.test(value)){settingsMessage='Enter an absolute Windows folder path.';render();return}defaultFolder=value;settingsMessage='Default folder saved.';render()}else if(action==='first-add'){simpleDialog('Choose a promotion folder','<p>Your selection is ready. Choose where to move it before starting your first promotion.</p><div class="destination-picker" style="margin-top:20px">'+icon('drive')+'<span class="mono">E:\\FastGames</span><button class="primary" data-action="first-choose">Use this folder</button></div><p class="help">This becomes your default for future additions.</p>')}else if(action==='first-choose'){defaultFolder='E:\\FastGames';batchFolder=defaultFolder;setScreen('review')}else if(action==='confirm-demote'){simpleDialog('Demoting '+selectedGame.name,'<div class="flex" style="margin-top:16px"><span class="spinner"></span><p>Moving back to the original location.</p></div><div class="info-box mono">'+escapeHtml(selectedGame.original)+'</div>')}});
    document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('table-area').innerHTML=promotionTable()}});
    document.addEventListener('keydown',e=>{const dialog=document.querySelector('[role="dialog"]');if(e.key==='Escape'){if(dialog){detailsOpen=false;if(['review','demote','close'].includes(state))state=hasQueue?'activity':'home';render()}else if(menuOpen){menuOpen=false;render()}return}if(e.key==='Tab'&&dialog){const focusable=[...dialog.querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    let dragDepth=0,dragPrevious=null;const app=document.getElementById('app');app.addEventListener('dragenter',e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();dragDepth++;if(state!=='drop'){dragPrevious=state;state='drop';render()}});app.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});app.addEventListener('dragleave',e=>{if(--dragDepth<=0&&dragPrevious){state=dragPrevious;dragPrevious=null;dragDepth=0;render()}});app.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;const entries=[...e.dataTransfer.files];if(entries.length){previewItems=entries.map(f=>({name:f.name,path:'Selected in File Explorer',file:!!f.type}));state='review';batchFolder=defaultFolder;dragPrevious=null;render()}});
    const initial=new URLSearchParams(location.search).get('screen');if(screens.some(([s])=>s===initial))setScreen(initial);else render();
  </script>
</body>
